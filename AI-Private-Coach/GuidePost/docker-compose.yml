version: "3.9"

services:

  api:
    build:
      context: .
      dockerfile: GuidePostPythonContainer/Dockerfile
    container_name: ai_coach_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://coach:coachpass@postgres:5432/ai_coach
      GUIDEPOST_DATA_DIR: /data
    depends_on:
      - postgres
    env_file:
      - GuidePostPythonContainer/.env
    volumes:
      - api_data:/data

  postgres:
    image: postgres:15
    container_name: ai_coach_db
    restart: always
    environment:
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coachpass
      POSTGRES_DB: ai_coach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  api_data: